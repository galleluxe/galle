name: Storefront CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter @galle/storefront exec tsc --noEmit

      - name: Lint
        run: pnpm --filter @galle/storefront lint

      - name: Unit tests (Vitest)
        run: pnpm --filter @galle/storefront test

      - name: Build
        run: pnpm --filter @galle/storefront build
        env:
          NEXT_PUBLIC_MEDUSA_URL: "http://localhost:9000"
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_test_ci"
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: "1"

      - name: Bundle size check
        run: |
          FIRST_JS=$(find apps/storefront/.next/static/chunks -name "*.js" -type f 2>/dev/null | head -1)
          if [ -n "$FIRST_JS" ]; then
            SIZE=$(wc -c < "$FIRST_JS" | tr -d ' ')
            echo "Largest chunk: ${SIZE} bytes"
            if [ "$SIZE" -gt 500000 ]; then
              echo "WARN: chunk exceeds 500KB — review bundle"
            fi
          fi

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @galle/storefront exec playwright install chromium --with-deps
      - name: Build storefront
        run: pnpm --filter @galle/storefront build
        env:
          NEXT_PUBLIC_MEDUSA_URL: "http://localhost:9000"
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_test_ci"
      - name: Run Playwright
        run: pnpm --filter @galle/storefront start & sleep 5 && pnpm --filter @galle/storefront e2e
        env:
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"
          CI: true

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @galle/storefront build
        env:
          NEXT_PUBLIC_MEDUSA_URL: "http://localhost:9000"
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_test_ci"
      - name: Lighthouse (home)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          runs: 1
        continue-on-error: true
